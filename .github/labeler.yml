# Auto-label PRs based on changed paths

python:
  - changed-files:
      - any-glob-to-any-file: ['*.py', '**/*.py']

scrapers:
  - changed-files:
      - any-glob-to-any-file: ['scrapers/**']

services:
  - changed-files:
      - any-glob-to-any-file: ['services/**']

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']

documentation:
  - changed-files:
      - any-glob-to-any-file: ['*.md', 'docs/**']
