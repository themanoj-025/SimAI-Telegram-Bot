[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "UP", "SIM", "C4", "RUF", "PLC", "PIE", "I"]
ignore = [
    "DTZ005",  # datetime.now() without tz
    "SIM117",  # multiple with-statements
    "PERF102", # incorrect dict iteration
    "RUF012",  # mutable class default
    "SIM102",  # collapsible if
    "E501",    # line too long
    "BLE001",  # blind except — defensive coding
    "UP031",   # printf formatting
    "PLC0415", # import-outside-top-level — lazy imports
    "E731",    # lambda assignment — legacy code
    "SIM105",  # suppressible-exception
    "F841",    # unused variable
    "B905",    # zip-without-strict
    "F821",    # undefined name — pre-existing missing imports
    "B007",    # unused loop variable
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
addopts = "--cov --cov-fail-under=50"
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_empty = true
