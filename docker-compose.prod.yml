# ═══════════════════════════════════════════════════════════════════════
# AI Telegram News Bot — Production override
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Hardening: restart always, explicit resource limits, no dev mounts.
# ═══════════════════════════════════════════════════════════════════════

services:
  bot:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
